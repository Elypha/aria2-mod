name: ariang-windows

on:
  push:
    tags:
      - 'ariang-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag'
        required: true
        type: string

permissions:
  contents: write

env:
  ver_nodejs_lts: "24.11.1"

jobs:
  build:
    name: Build assets ariang-native-win
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.ver_nodejs_lts }}/node-v${{ env.ver_nodejs_lts }}-x64.msi" -OutFile "nodejs.msi"; `
          msiexec /i nodejs.msi

      - name: Get source code
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mayswind/AriaNg-Native.git ariang
          cd ariang
          $patches = Get-ChildItem "../ariang-native-patch" -Filter *.patch
          foreach ($patch in $patches) {
            git apply $patch.FullName
          }

      - name: Build
        shell: pwsh
        working-directory: ./ariang
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run publish:win

      - name: Get filenames
        id: get_filenames
        shell: pwsh
        run: |
          "name_x64_7z=$((Get-ChildItem ariang/dist/AriaNg_Native-*-Windows-x64.7z).Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name_x86_7z=$((Get-ChildItem ariang/dist/AriaNg_Native-*-Windows-x86.7z).Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name_x64_exe=$((Get-ChildItem ariang/dist/AriaNg_Native-*-Windows-x64.exe).Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name_x86_exe=$((Get-ChildItem ariang/dist/AriaNg_Native-*-Windows-x86.exe).Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Make Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            ariang/dist/${{ steps.get_filenames.outputs.name_x64_7z }}
            ariang/dist/${{ steps.get_filenames.outputs.name_x86_7z }}
            ariang/dist/${{ steps.get_filenames.outputs.name_x64_exe }}
            ariang/dist/${{ steps.get_filenames.outputs.name_x86_exe }}
